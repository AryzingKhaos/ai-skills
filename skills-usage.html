<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill 速查</title>
<style>
  :root {
    --bg: #f3f8fe;
    --bg-hero: linear-gradient(180deg, #e3f0fd 0%, #f3f8fe 100%);
    --surface: #ffffff;
    --surface-2: #f1f7fe;
    --border: #dae7f5;
    --border-strong: #c3d8f0;
    --text: #182a3d;
    --text-2: #4d6378;
    --text-3: #8396ab;
    --primary: #2f80ed;
    --primary-strong: #1c63c6;
    --primary-soft: #e4f0fd;
    --primary-ring: rgba(47, 128, 237, .22);
    --opt: #8396ab;
    --pipe: #b3c5d9;
    --shadow: 0 1px 2px rgba(28, 82, 150, .05), 0 6px 20px rgba(28, 82, 150, .05);
    --toast-bg: #182a3d;   --toast-text: #ffffff;
    --cat-work: #2f80ed;  --cat-flow: #5b5fe0;  --cat-life: #cf6a1c;  --cat-invest: #0e9384;
    --cat-game: #8f52dd;  --cat-learn: #2b8f40; --cat-collect: #a36d14; --cat-files: #0a87a8;
    --cat-write: #cc3a76; --cat-tool: #5f6f84;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1724;
      --bg-hero: linear-gradient(180deg, #11233a 0%, #0d1724 100%);
      --surface: #142132;
      --surface-2: #19293e;
      --border: #22354d;
      --border-strong: #2e4663;
      --text: #e2ebf5;
      --text-2: #a2b3c6;
      --text-3: #6d8298;
      --primary: #6aaefc;
      --primary-strong: #93c4ff;
      --primary-soft: #183150;
      --primary-ring: rgba(106, 174, 252, .28);
      --opt: #7c90a6;
      --pipe: #3d536d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 20px rgba(0, 0, 0, .18);
      --toast-bg: #e2ebf5;   --toast-text: #0d1724;
      --cat-work: #6aaefc;  --cat-flow: #9b9dff;  --cat-life: #f5a463;  --cat-invest: #4fd1c0;
      --cat-game: #c49bff;  --cat-learn: #6fd18a; --cat-collect: #e6b450; --cat-files: #5fcbe6;
      --cat-write: #f37aae; --cat-tool: #a3b1c4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1724;
    --bg-hero: linear-gradient(180deg, #11233a 0%, #0d1724 100%);
    --surface: #142132;
    --surface-2: #19293e;
    --border: #22354d;
    --border-strong: #2e4663;
    --text: #e2ebf5;
    --text-2: #a2b3c6;
    --text-3: #6d8298;
    --primary: #6aaefc;
    --primary-strong: #93c4ff;
    --primary-soft: #183150;
    --primary-ring: rgba(106, 174, 252, .28);
    --opt: #7c90a6;
    --pipe: #3d536d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 20px rgba(0, 0, 0, .18);
    --toast-bg: #e2ebf5;   --toast-text: #0d1724;
    --cat-work: #6aaefc;  --cat-flow: #9b9dff;  --cat-life: #f5a463;  --cat-invest: #4fd1c0;
    --cat-game: #c49bff;  --cat-learn: #6fd18a; --cat-collect: #e6b450; --cat-files: #5fcbe6;
    --cat-write: #f37aae; --cat-tool: #a3b1c4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 20px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "PingFang SC", monospace; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  button { font: inherit; }

  /* ---------- hero ---------- */
  .hero { background: var(--bg-hero); border-bottom: 1px solid var(--border); padding: 40px 0 26px; }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
    font: 600 22px/1 "SF Mono", Menlo, monospace;
    box-shadow: 0 6px 16px var(--primary-ring);
  }
  h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: .01em; }
  .sub { margin: 2px 0 0; color: var(--text-2); font-size: 14px; }
  .theme-btn {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    display: grid; place-items: center; cursor: pointer;
  }
  .theme-btn:hover { color: var(--primary); border-color: var(--border-strong); }

  .search { display: block; margin-top: 24px; position: relative; max-width: 560px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
  .search input {
    width: 100%; height: 46px; padding: 0 44px 0 42px;
    border-radius: 12px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); font: inherit; font-size: 15px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-ring); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 12px/1 "SF Mono", Menlo, monospace; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; background: var(--surface-2);
  }

  .chips { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    border-radius: 999px; padding: 5px 13px; font-size: 13.5px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .chip .n { opacity: .65; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip[aria-pressed="true"] .dot { background: #fff; }

  .bar { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-3); }
  .legend code { font-size: 12.5px; }
  .bulk {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    border-radius: 9px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .bulk:hover { color: var(--primary); border-color: var(--border-strong); }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 36px; padding: 28px 0 56px; }
  .toc {
    position: sticky; top: 20px; align-self: start; font-size: 13.5px;
    max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px;
  }
  .toc h4 { display: flex; align-items: center; gap: 7px; margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .06em; }
  .toc h4::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .toc ul { list-style: none; margin: 0 0 14px; padding: 0; }
  .toc a {
    display: block; padding: 3px 10px; margin-left: -10px; border-radius: 7px;
    color: var(--text-2); text-decoration: none; font-family: "SF Mono", Menlo, monospace; font-size: 12.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toc a:hover { background: var(--primary-soft); color: var(--primary-strong); }
  .cards { display: grid; gap: 14px; }
  .empty { display: none; text-align: center; color: var(--text-3); padding: 48px 0; }

  /* ---------- card ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px 18px 24px; box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .card.flash { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-ring); }
  .card-top { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .card-main { flex: 1; min-width: 0; }
  .card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .card-name { margin: 0; font: 600 17.5px/1.35 "SF Mono", "JetBrains Mono", Menlo, monospace; }
  .tag { font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .tag-cat { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .tag-plain { color: var(--text-2); border: 1px solid var(--border-strong); padding: 4px 8px; }
  .src { margin-left: auto; font-size: 12.5px; color: var(--text-3); text-decoration: none; white-space: nowrap; }
  .src:hover { color: var(--primary); }
  .summary { margin: 6px 0 0; color: var(--text-2); }

  .toggle {
    flex: none; display: inline-flex; align-items: center; gap: 6px; margin-top: -2px;
    height: 30px; padding: 0 8px 0 10px; border-radius: 8px; border: 0; cursor: pointer;
    background: transparent; color: var(--text-3); font-size: 12.5px; white-space: nowrap;
  }
  .card-top:hover .toggle, .toggle:focus-visible { background: var(--primary-soft); color: var(--primary); }
  .toggle svg { transition: transform .22s ease; }
  .card[data-open="true"] .toggle svg { transform: rotate(180deg); }

  .syntax {
    margin-top: 12px; display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 10px 9px 14px;
  }
  .syntax code { flex: 1; font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; padding-top: 3px; }
  .t-cmd { color: var(--primary-strong); font-weight: 600; }
  .t-req { color: var(--primary); }
  .t-opt { color: var(--opt); }
  .t-pipe { color: var(--pipe); padding: 0 1px; }

  .icon-btn {
    flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0; cursor: pointer;
    background: transparent; color: var(--text-3); display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--primary-soft); color: var(--primary); }

  .card-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s ease; }
  .card[data-open="true"] .card-body { grid-template-rows: 1fr; }
  .card-body > .inner { overflow: hidden; min-height: 0; }

  .label { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .08em; }
  .usage { display: grid; grid-template-columns: max-content minmax(0, 1fr); border-top: 1px solid var(--border); }
  .usage > * { border-bottom: 1px solid var(--border); padding: 9px 0; }
  .usage .desc { padding-left: 20px; color: var(--text-2); font-size: 14px; display: flex; align-items: center; }
  .cmd-wrap { display: flex; align-items: center; }
  .cmd {
    display: inline-flex; align-items: center; gap: 8px; max-width: 460px;
    font: 13px/1.5 "SF Mono", "JetBrains Mono", Menlo, monospace; color: var(--text);
    background: var(--primary-soft); border: 1px solid transparent; border-radius: 8px;
    padding: 4px 10px; cursor: pointer; text-align: left; overflow-wrap: anywhere;
    transition: border-color .15s;
  }
  .cmd:hover { border-color: var(--primary); }
  .cmd svg { color: var(--text-3); flex: none; opacity: 0; transition: opacity .15s; }
  .cmd:hover svg, .cmd:focus-visible svg, .cmd.copied svg { opacity: 1; color: var(--primary); }
  .cmd.copied { border-color: var(--primary); }
  .cmd.nl { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-2); }

  .notes { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
  .notes dt { color: var(--text-3); }
  .notes dd { margin: 0; color: var(--text-2); }
  .notes code, .desc code, .summary code {
    font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 5px; color: var(--text); overflow-wrap: anywhere;
  }
  .related { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
  .related a {
    font: 12.5px "SF Mono", Menlo, monospace; color: var(--primary); text-decoration: none;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
  }
  .related a:hover { border-color: var(--primary); background: var(--primary-soft); }

  mark { background: rgba(255, 214, 102, .55); color: inherit; border-radius: 3px; padding: 0 1px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px);
    background: var(--toast-bg); color: var(--toast-text); font-size: 13.5px;
    padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { color: var(--text-3); font-size: 13px; padding-bottom: 40px; }

  @media (prefers-reduced-motion: reduce) {
    .card-body, .toggle svg { transition: none; }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding-top: 20px; }
    .toc { display: none; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .hero { padding: 28px 0 20px; }
    h1 { font-size: 22px; }
    .card { position: relative; padding: 16px 14px 16px 16px; border-radius: 14px; }
    .card-head { padding-right: 34px; }
    .src { margin-left: 0; width: 100%; }
    .toggle .count { display: none; }
    .toggle { position: absolute; top: 14px; right: 10px; margin: 0; padding: 0 7px; }
    .usage { grid-template-columns: minmax(0, 1fr); }
    .usage .cmd-wrap { border-bottom: 0; padding-bottom: 2px; }
    .usage .desc { padding-left: 2px; padding-top: 0; font-size: 13.5px; }
    .cmd { max-width: 100%; }
    .notes { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .notes dd { margin-bottom: 8px; }
    .search kbd { display: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="brand">
        <div class="logo" aria-hidden="true">/</div>
        <div>
          <h1>Skill 速查</h1>
          <p class="sub" id="sub"></p>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>

    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜 skill 名、子命令或用途，如 commit、打卡、网盘" autocomplete="off" aria-label="搜索 skill">
      <kbd>/</kbd>
    </label>

    <div class="chips" id="chips" role="group" aria-label="按分类筛选"></div>

    <div class="bar">
      <div class="legend" aria-label="语法图例">
        <span><code class="t-req">&lt;必填&gt;</code></span>
        <span><code><span class="t-opt">[</span>可选<span class="t-opt">]</span></code></span>
        <span><code>a <span class="t-pipe">|</span> b</code> 多选一</span>
      </div>
      <button class="bulk" id="bulk" type="button"></button>
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="目录"></nav>
  <main>
    <div class="cards" id="cards"></div>
    <p class="empty" id="empty">没有匹配的 skill</p>
  </main>
</div>

<footer class="wrap">语法行即各 SKILL.md 的 <code>argument-hint</code>；点任意命令可复制。改了 hint 后可运行 <code>python3 check_skills_usage.py</code> 核对。</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
 * 数据：每个 skill 一项，按分类和使用频率排序。
 *   name    = SKILL.md 的 name（斜杠命令名）；目录名不同时写 dir
 *   hint    = SKILL.md 的 argument-hint（原样，check_skills_usage.py 会核对）
 *   usage   = [命令, 说明]；不以 / 开头的命令是自然语言调用
 *   notes   = [标签, 内容]；内容里的 `xxx` 渲染成代码
 *   manual  = 仅能手动输入（disable-model-invocation）
 *   auto    = 不点名也会自动触发
 * ============================================================ */
const CATEGORIES = {
  work:    "工作",
  flow:    "角色流程",
  life:    "目标与生活",
  invest:  "投资",
  game:    "游戏",
  learn:   "学习",
  collect: "采集与转写",
  files:   "文件与网盘",
  write:   "写作发布",
  tool:    "Claude 工具",
};

const SKILLS = [
  /* ---------------- 工作 ---------------- */
  {
    name: "progress-work",
    cat: "work",
    manual: true,
    summary: "项目进度工具：把本周改动整理进进度表，再给各仓库写提交文案、提交、推送。",
    hint: "record [描述] | draft | commit | push（后三个可连用）",
    usage: [
      ["/progress-work record", "对所有项目自动整理本周改动，同步项目开发细则；写入前先出草稿"],
      ["/progress-work record 上周的 llmWikis", "按描述执行：限定时间、限定项目，或写入你说的进度"],
      ["/progress-work draft", "为每个项目仓库写英文提交文案（只读，不提交）"],
      ["/progress-work commit", "提交"],
      ["/progress-work push", "推送到远端"],
      ["/progress-work draft commit push", "三步连用，按顺序执行"],
    ],
    notes: [
      ["数据源", "`~/workspace/个人/工作相关/所有事项进度.md`，项目清单以其中「统计的项目地址」为准"],
      ["注意", "子命令只认全小写；不带子命令或写错（如 `Record`）都不会执行"],
      ["调用", "只能你亲手输入，Claude 不会自己调用"],
    ],
    related: ["work-time"],
  },
  {
    name: "work-time",
    cat: "work",
    summary: "统计你用 AI 工作的真实时长，按项目路径分成工作 / planB / 其他三类；也能手动打卡记录看书、开会。",
    hint: "[N天 | 日期范围] | start <内容> | end [内容] | endTime <HH:MM> | status",
    usage: [
      ["/work-time", "统计当前自然周：增量归档会话日志，并更新台账"],
      ["/work-time 上周", "统计其他时间段，过去 N 天、指定日期范围也行"],
      ["/work-time start 看书", "开始手动打卡，结束后计入 planB"],
      ["/work-time end", "结束打卡；后面可再写内容，覆盖 start 时写的"],
      ["/work-time endTime 22:30", "按指定时间结束打卡，忘了及时 end 时用"],
      ["/work-time status", "查看当前有没有进行中的打卡"],
      ["调用 work-time 修改 planB 路径", "改了项目分类路径后，用已归档数据重分台账"],
    ],
    notes: [
      ["台账", "`~/workspace/个人/生活/工作时长.md`，项目路径也在这里维护"],
      ["口径", "同类事件间隔 ≤30 分钟合并成一段，每段前后各加 5 分钟"],
      ["注意", "进行中的打卡不计时，`end` 或 `endTime` 之后才算"],
    ],
    related: ["dota2-playtime", "rest-check", "progress-work"],
  },
  {
    name: "task-splitting",
    cat: "work",
    summary: "把一份 PRD 拆成每项不超过 4h 的细分任务，结合当前目录的真实代码，给出无 AI / 有 AI 两套人时估算。",
    hint: "<PRD 文件路径>",
    usage: [
      ["/task-splitting raw/prd-01.md", "拆分这份 PRD 并估工时"],
    ],
    notes: [

/* ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON_COPY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_OK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_CHEVRON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const catVar = key => `--c: var(--cat-${key})`;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let query = "";
let activeCat = "all";
// 展开状态：平时用 openSet（会记住）；搜索时用 searchOpen（命中的默认全展开，清空搜索即恢复）
const openSet = new Set(JSON.parse(store.get("skills-open") || "[]"));
let searchOpen = new Set();

const isOpen = name => (query ? searchOpen : openSet).has(name);
function setOpen(name, open) {
  const set = query ? searchOpen : openSet;
  open ? set.add(name) : set.delete(name);
  if (!query) store.set("skills-open", JSON.stringify([...openSet]));
}

// 转义文本，并把搜索词包进 <mark>
function hl(raw) {
  raw = String(raw);
  const words = query.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return esc(raw);
  return raw.split(new RegExp(`(${words.join("|")})`, "gi"))
    .map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}
// 同 hl()，另外把 `xxx` 渲染成 <code>
function inline(raw) {
  return String(raw).split("`").map((seg, i) => i % 2 ? `<code>${hl(seg)}</code>` : hl(seg)).join("");
}
function syntaxHtml(name, hint) {
  const body = esc(hint)
    .replace(/&lt;[^&]*?&gt;/g, m => `<span class="t-req">${m}</span>`)
    .replace(/[\[\]]/g, m => `<span class="t-opt">${m}</span>`)
    .replace(/ \| |\|/g, m => `<span class="t-pipe">${m}</span>`);
  return `<span class="t-cmd">/${esc(name)}</span> ${body}`;
}

function matches(s) {
  if (activeCat !== "all" && s.cat !== activeCat) return false;
  if (!query) return true;
  const hay = [s.name, s.dir, s.summary, s.hint, CATEGORIES[s.cat],
    ...s.usage.flat(), ...(s.notes || []).flat()].join("\n").toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function card(s) {
  const open = isOpen(s.name);
  const usage = s.usage.map(([cmd, desc]) => `
      <div class="cmd-wrap"><button class="cmd ${cmd.startsWith("/") ? "" : "nl"}" type="button" data-copy="${esc(cmd)}" title="点击复制">${hl(cmd)}${ICON_COPY}</button></div>
      <div class="desc"><span>${inline(desc)}</span></div>`).join("");
  const notes = (s.notes || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${inline(v)}</dd>`).join("");
  const related = (s.related || []).filter(r => SKILLS.some(x => x.name === r))
    .map(r => `<a href="#${esc(r)}">${esc(r)}</a>`).join("");
  return `
  <article class="card" id="${esc(s.name)}" data-open="${open}">
    <div class="card-top">
      <div class="card-main">
        <div class="card-head">
          <h2 class="card-name">${hl(s.name)}</h2>
          <span class="tag tag-cat" style="${catVar(s.cat)}">${esc(CATEGORIES[s.cat])}</span>
          ${s.manual ? '<span class="tag tag-plain" title="disable-model-invocation：Claude 不会自己调用">仅手动输入</span>' : ""}
          ${s.auto ? '<span class="tag tag-plain" title="不点名，说出相关需求也会触发">可自动触发</span>' : ""}
          <a class="src" href="skills/${esc(s.dir || s.name)}/SKILL.md" target="_blank" rel="noopener">SKILL.md ↗</a>
        </div>
        <p class="summary">${inline(s.summary)}</p>
      </div>
      <button class="toggle" type="button" aria-expanded="${open}" aria-controls="body-${esc(s.name)}" aria-label="展开或折叠 ${esc(s.name)}">
        <span class="count">${s.usage.length} 种用法</span>${ICON_CHEVRON}
      </button>
    </div>
    <div class="syntax">
      <code>${syntaxHtml(s.name, s.hint)}</code>
      <button class="icon-btn" type="button" data-copy="/${esc(s.name)} " title="复制命令名" aria-label="复制 /${esc(s.name)}">${ICON_COPY}</button>
    </div>
    <div class="card-body" id="body-${esc(s.name)}">
      <div class="inner"${open ? "" : " inert"}>
        <div class="label">用法</div>
        <div class="usage">${usage}</div>
        ${notes ? `<div class="label">要点</div><dl class="notes">${notes}</dl>` : ""}
        ${related ? `<div class="related">相关<span>·</span>${related}</div>` : ""}
      </div>
    </div>
  </article>`;
}

function applyOpen(el, open) {
  el.dataset.open = open;
  $(".toggle", el).setAttribute("aria-expanded", open);
  $(".inner", el).inert = !open;
}

function visibleCards() { return [...document.querySelectorAll("#cards .card")]; }

function updateBulk() {
  const cards = visibleCards();
  const allOpen = cards.length > 0 && cards.every(c => c.dataset.open === "true");
  const btn = $("#bulk");
  btn.dataset.action = allOpen ? "collapse" : "expand";
  btn.innerHTML = `${ICON_CHEVRON.replace("<svg", `<svg style="transform:rotate(${allOpen ? 180 : 0}deg)"`)}${allOpen ? "全部折叠" : "全部展开"}`;
  btn.hidden = cards.length === 0;
}

function render() {
  const list = SKILLS.filter(matches);
  $("#cards").innerHTML = list.map(card).join("");
  $("#empty").style.display = list.length ? "none" : "block";

  $("#toc").innerHTML = Object.entries(CATEGORIES).map(([key, label]) => {
    const items = list.filter(s => s.cat === key);
    if (!items.length) return "";
    return `<h4 style="${catVar(key)}">${esc(label)}</h4><ul>${items.map(s => `<li><a href="#${esc(s.name)}">${esc(s.name)}</a></li>`).join("")}</ul>`;
  }).join("");
  updateBulk();
}

function renderChips() {
  const counts = { all: SKILLS.length };
  SKILLS.forEach(s => counts[s.cat] = (counts[s.cat] || 0) + 1);
  const entries = [["all", "全部"], ...Object.entries(CATEGORIES).filter(([k]) => counts[k])];
  $("#chips").innerHTML = entries.map(([k, label]) =>
    `<button class="chip" type="button" data-cat="${k}" aria-pressed="${k === activeCat}">${k === "all" ? "" : `<span class="dot" style="${catVar(k)}"></span>`}${esc(label)}<span class="n">${counts[k]}</span></button>`
  ).join("");
}

/* ---------- 跳转到某个 skill：必要时清除筛选，展开并高亮 ---------- */
function goTo(name, smooth = true) {
  if (!SKILLS.some(s => s.name === name)) return;
  if (!document.getElementById(name)) {
    query = ""; $("#q").value = ""; activeCat = "all";
    renderChips(); render();
  }
  const el = document.getElementById(name);
  setOpen(name, true); applyOpen(el, true); updateBulk();
  el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
  history.replaceState(null, "", "#" + name);
}

/* ---------- 交互 ---------- */
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }
}

document.addEventListener("click", async e => {
  const chip = e.target.closest(".chip");
  if (chip) { activeCat = chip.dataset.cat; renderChips(); render(); return; }

  const anchor = e.target.closest('a[href^="#"]');
  if (anchor) { e.preventDefault(); goTo(decodeURIComponent(anchor.getAttribute("href").slice(1))); return; }

  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) {
    await copy(copyBtn.dataset.copy);
    toast(`已复制：${copyBtn.dataset.copy.trim()}`);
    if (copyBtn.classList.contains("cmd")) {
      copyBtn.classList.add("copied"); $("svg", copyBtn).outerHTML = ICON_OK;
      setTimeout(() => { copyBtn.classList.remove("copied"); const s = $("svg", copyBtn); if (s) s.outerHTML = ICON_COPY; }, 1200);
    }
    return;
  }

  if (e.target.closest("#bulk")) {
    const open = $("#bulk").dataset.action === "expand";
    visibleCards().forEach(el => { setOpen(el.id, open); applyOpen(el, open); });
    updateBulk();
    return;
  }

  const top = e.target.closest(".card-top");
  if (top && !e.target.closest("a")) {
    if (getSelection().toString()) return; // 选中文字时不折叠
    const el = top.closest(".card");
    const open = el.dataset.open !== "true";
    setOpen(el.id, open); applyOpen(el, open); updateBulk();
  }
});

$("#q").addEventListener("input", e => {
  query = e.target.value.trim();
  searchOpen = new Set(query ? SKILLS.filter(matches).map(s => s.name) : []);
  render();
});
document.addEventListener("keydown", e => {
  const inInput = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !inInput) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) {
    $("#q").value = ""; query = ""; render(); $("#q").blur();
  }
});

/* ---------- 主题 ---------- */
const root = document.documentElement;
const savedTheme = store.get("skills-theme");
if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("skills-theme", root.dataset.theme);
});

$("#sub").textContent = `ai-skills · ${SKILLS.length} 个 skill · 点卡片展开，点命令复制`;
renderChips();
render();
if (location.hash) requestAnimationFrame(() => goTo(decodeURIComponent(location.hash.slice(1)), false));
</script>
